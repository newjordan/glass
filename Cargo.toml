[workspace]
resolver = "3"
members = ["crates/stage", "crates/gpu", "crates/glass", "crates/term", "crates/alacritty-terminal", "crates/vte"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

# The allocator's C is built at the profile's level, and unoptimized it made
# every allocation-heavy test several times slower in debug builds (CI's).
[profile.dev.package.libmimalloc-sys]
opt-level = 3
