[package]
name = "glass-stage"
version = "0.1.0"
description = "glass's scene descriptions: layers, and a 3D scene of nodes, meshes and materials, as the window (crates/glass) draws them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Every description as serde data: the terminal's scene wire maps onto
# these types (crates/term/src/intake/glass_scene.rs).
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"], optional = true }
