[package]
name = "glass-window"
version = "0.1.0"
description = "angelX's own window: a GPU compositor where the cockpit's text is one layer (docs/RENDER_FOUNDATION.md)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Remote glass (docs/REMOTE_GLASS.md): a host with no window whose frames go
# over a link to windows on other machines, and the window end of that link.
remote = ["dep:serde", "dep:bincode", "dep:flate2", "dep:libc", "glass-stage/serde", "glass-gpu/serde", "crossterm/serde"]

[dependencies]
# What a stage is: layers, motes, pictures (shared with the browser).
glass-stage = { path = "../stage" }
# The GPU half: pipeline, pictures, stages, atlas, layer compiler. glass makes
# the device and the window around it. The core picks no wgpu backend, so the
# dependency below turns on Vulkan and Metal for both.
glass-gpu = { path = "../gpu" }
# The cockpit draws into ratatui's buffer; glass is one more backend for it.
# `underline-color` matches the cockpit's build, so `Cell` has the same fields.
ratatui-core = { version = "0.1.2", features = ["std", "underline-color"] }
# Window input arrives as the same events the terminal reader delivers.
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "metal"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# Outlines and bitmaps from font files; the atlas, cache and drawing are ours.
swash = "0.2"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0.1"
unicode-width = "0.2"
# Screenshots taken from inside the window.
png = "0.18"
# The remote link's messages and their compression (feature `remote`).
serde = { version = "1", features = ["derive", "rc"], optional = true }
bincode = { version = "1.3", optional = true }
flate2 = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The window's first frames, drawn on the CPU into shared memory while the
# GPU opens (src/early.rs), on a connection of our own to winit's display:
# the versions winit's own Wayland stack already locks.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[dev-dependencies]
