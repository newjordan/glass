# glass's fork of alacritty_terminal 0.26.0, the terminal library of the
# Alacritty project (https://github.com/alacritty/alacritty, commit
# 94e7c8874e526b1e67b349d9ba30ddf81669119e). Apache-2.0, as upstream; see
# README.md for the credit and CHANGES.md for every change from upstream.
# The library keeps its upstream name, so code using it reads the same.
[package]
name = "glass-alacritty-terminal"
version = "0.26.0"
authors = [
    "Christian Duerr <contact@christianduerr.com>",
    "Joe Wilm <joe@jwilm.com>",
    "The Alacritty contributors",
    "Jordan Newman <newjordan@gmail.com> (the glass changes)",
]
license = "Apache-2.0"
description = "glass's fork of alacritty_terminal, Alacritty's library for writing terminal emulators"
readme = "README.md"
repository = "https://github.com/newjordan/glass"
edition = "2024"
rust-version.workspace = true
publish = false

[lib]
name = "alacritty_terminal"

[features]
default = ["serde"]
serde = ["dep:serde", "bitflags/serde", "vte/serde"]

[dependencies]
arrayvec = { version = "0.7.2", features = ["serde"] }
base64 = "0.22.0"
bitflags = "2.4.1"
home = "0.5.5"
libc = "0.2"
log = "0.4"
parking_lot = "0.12.0"
polling = "3.8.0"
regex-automata = "0.4.3"
unicode-width = "0.2.0"
vte = { path = "../vte", default-features = false, features = ["std", "ansi"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"
rustix = { version = "1.0.0", default-features = false, features = ["std"] }
signal-hook = "0.4.3"

[target.'cfg(windows)'.dependencies]
piper = "0.2.1"
miow = "0.6.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]}

[dev-dependencies]
serde_json = "1.0.0"
