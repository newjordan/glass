[package]
name = "glass-gpu"
version = "0.1.0"
description = "glass's renderer core: one instanced-quad pipeline, a mesh pipeline with depth for 3D scenes, pictures, stages and the layer compiler on a wgpu device the host makes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# wgpu's browser backend, so the core can be checked for wasm32-unknown-unknown
# (`cargo check -p glass-gpu --target wasm32-unknown-unknown --features web`).
# The core picks no backend of its own: the window's crate turns on Vulkan and
# Metal, a browser build would turn on this.
web = ["wgpu/webgpu"]

[dependencies]
# What a stage is: layers, motes, pictures.
glass-stage = { path = "../stage" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
