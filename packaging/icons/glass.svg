<?xml version="1.0" encoding="UTF-8"?>
<!-- glass: a pane of glass with a prompt lit on it. MIT, Jordan Newman. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16212b"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff3ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- The pane. -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#ground)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#sheen)"/>
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="url(#rim)" stroke-width="16"/>
  <!-- The prompt's light, then the prompt. -->
  <g fill="none" stroke="#00e5ff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.85">
    <path d="M146 164 L246 256 L146 348" stroke-width="56"/>
    <path d="M286 346 L374 346" stroke-width="56"/>
  </g>
  <g fill="none" stroke="#00e5ff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146 164 L246 256 L146 348" stroke-width="56"/>
    <path d="M286 346 L374 346" stroke-width="56"/>
  </g>
  <g fill="none" stroke="#d9fbff" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M146 164 L246 256 L146 348" stroke-width="14"/>
    <path d="M286 346 L374 346" stroke-width="14"/>
  </g>
</svg>
